<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; align-items: center; padding: 16px;
    -webkit-app-region: drag;
  }
  .panel {
    position: relative; width: 100%; height: 100%;
    display: flex; gap: 16px; align-items: center;
    padding: 18px; border-radius: 22px;
    background: linear-gradient(135deg, rgba(24,28,38,.92), rgba(12,15,22,.94));
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 24px 70px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(20px) saturate(150%);
    overflow: hidden;
  }
  .panel::before {
    content: ''; position: absolute; inset: -40%;
    background: radial-gradient(circle at 20% 30%, rgba(118,221,200,.22), transparent 55%);
    pointer-events: none;
  }
  .cover {
    width: 118px; height: 118px; border-radius: 18px; object-fit: cover;
    background: linear-gradient(145deg,#2a2f3d,#151924); flex: 0 0 118px;
    box-shadow: 0 14px 34px rgba(0,0,0,.42);
  }
  .main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .title { font-size: 19px; font-weight: 700; color: #f4f7ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 26px; }
  .artist { font-size: 12px; color: rgba(244,247,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#76ddc8,#8fb7ff); border-radius: inherit; transition: width .2s linear; }
  .ctl { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .ctl button {
    -webkit-app-region: no-drag;
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06); color: #f4f7ff;
    cursor: pointer; font-size: 13px; line-height: 32px; text-align: center;
  }
  .ctl button:hover { border-color: #76ddc8; color: #76ddc8; }
  .ctl button.play { width: 42px; height: 42px; font-size: 15px; line-height: 40px; background: rgba(118,221,200,.16); border-color: rgba(118,221,200,.5); }
  .close {
    -webkit-app-region: no-drag;
    position: absolute; top: 10px; right: 12px;
    width: 24px; height: 24px; border: none; border-radius: 6px;
    background: transparent; color: rgba(255,255,255,.55); cursor: pointer; font-size: 15px;
  }
  .close:hover { color: #fff; background: rgba(255,255,255,.10); }
  .empty { color: rgba(255,255,255,.55); font-size: 13px; }
</style>
</head>
<body>
  <div class="panel">
    <button class="close" id="close" title="关闭音乐桌面">✕</button>
    <img class="cover" id="cover" src="build/icon.svg" alt="">
    <div class="main">
      <div class="title" id="title">小杨音乐 · 音乐桌面</div>
      <div class="artist" id="artist">等待播放歌曲</div>
      <div class="bar"><i id="progress"></i></div>
      <div class="ctl">
        <button id="prev" title="上一首">⏮</button>
        <button id="play" class="play" title="播放/暂停">▶</button>
        <button id="next" title="下一首">⏭</button>
        <button id="lyric" title="显示/隐藏桌面歌词">词</button>
      </div>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const $ = (id) => document.getElementById(id);
    ipcRenderer.on('desktopMusic:payload', (e, p) => {
      p = p || {};
      $('title').textContent = p.name || '未播放';
      $('artist').textContent = p.artist || '等待播放歌曲';
      if (p.pic) $('cover').src = p.pic;
      $('play').textContent = p.playing ? '⏸' : '▶';
      const d = Number(p.duration) || 0;
      $('progress').style.width = (d ? Math.min(100, Math.max(0, (Number(p.position) || 0) / d * 100)) : 0) + '%';
    });
    $('prev').addEventListener('click', () => ipcRenderer.send('desktopMusic:ctrl', 'prev'));
    $('next').addEventListener('click', () => ipcRenderer.send('desktopMusic:ctrl', 'next'));
    $('play').addEventListener('click', () => ipcRenderer.send('desktopMusic:ctrl', 'toggle'));
    $('lyric').addEventListener('click', () => ipcRenderer.send('desktopMusic:ctrl', 'lyric'));
    $('close').addEventListener('click', () => ipcRenderer.send('desktopMusic:close'));
  </script>
</body>
</html>
