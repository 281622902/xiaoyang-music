<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; align-items: center; padding: 14px;
    -webkit-app-region: drag;
  }
  .panel {
    --dp-text: #f4f7ff; --dp-sub: rgba(244,247,255,.62);
    --dp-line: rgba(255,255,255,.14); --dp-chip: rgba(255,255,255,.06);
    --dp-glow: rgba(118,221,200,.22); --dp-accent-border: rgba(118,221,200,.5);
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; gap: 10px;
    padding: 16px 18px 14px; border-radius: 22px;
    background: linear-gradient(135deg, var(--dp-bg1), var(--dp-bg2));
    border: 1px solid var(--dp-line);
    box-shadow: 0 24px 70px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(20px) saturate(150%);
    overflow: hidden;
  }
  /* ── 主题 ── */
  .panel[data-theme="midnight"] { --dp-bg1: rgba(24,28,38,.93); --dp-bg2: rgba(12,15,22,.95); --dp-accent: #76ddc8; --dp-accent2: #8fb7ff; --dp-glow: rgba(118,221,200,.22); --dp-accent-border: rgba(118,221,200,.5); }
  .panel[data-theme="nebula"]   { --dp-bg1: rgba(44,30,66,.93);  --dp-bg2: rgba(20,12,34,.95);  --dp-accent: #b48cff; --dp-accent2: #7fd0ff; --dp-glow: rgba(180,140,255,.24); --dp-accent-border: rgba(180,140,255,.5); }
  .panel[data-theme="sunset"]   { --dp-bg1: rgba(58,32,18,.93);  --dp-bg2: rgba(30,14,8,.95);   --dp-accent: #ffab6b; --dp-accent2: #ff7a59; --dp-glow: rgba(255,150,90,.22); --dp-accent-border: rgba(255,150,90,.5); }
  .panel[data-theme="sakura"]   { --dp-bg1: rgba(56,30,44,.93);  --dp-bg2: rgba(30,16,26,.95);  --dp-accent: #ff9fc0; --dp-accent2: #ffc7e0; --dp-glow: rgba(255,160,192,.22); --dp-accent-border: rgba(255,160,192,.5); }
  .panel[data-theme="pine"]     { --dp-bg1: rgba(20,42,32,.93);  --dp-bg2: rgba(10,22,16,.95);  --dp-accent: #7fe0a8; --dp-accent2: #b8f0d0; --dp-glow: rgba(127,224,168,.2); --dp-accent-border: rgba(127,224,168,.5); }
  .panel[data-theme="mist"] {
    --dp-bg1: rgba(248,250,253,.95); --dp-bg2: rgba(232,238,246,.96);
    --dp-text: #1c2530; --dp-sub: rgba(28,37,48,.62); --dp-line: rgba(28,37,48,.12);
    --dp-chip: rgba(28,37,48,.06); --dp-accent: #4f9efc; --dp-accent2: #7cc4ff;
    --dp-glow: rgba(79,158,252,.14); --dp-accent-border: rgba(79,158,252,.5);
    box-shadow: 0 24px 70px rgba(40,60,90,.28), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .panel::before {
    content: ''; position: absolute; inset: -40%;
    background: radial-gradient(circle at 20% 30%, var(--dp-glow), transparent 55%);
    pointer-events: none;
  }
  .head { position: relative; display: flex; gap: 14px; align-items: center; }
  .cover {
    width: 84px; height: 84px; border-radius: 16px; object-fit: cover;
    background: linear-gradient(145deg,#2a2f3d,#151924); flex: 0 0 84px;
    box-shadow: 0 12px 28px rgba(0,0,0,.4);
  }
  .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .title { font-size: 17px; font-weight: 700; color: var(--dp-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4px; }
  .artist { font-size: 12px; color: var(--dp-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ── 波动特效 ── */
  .viz { position: relative; display: flex; gap: 3px; align-items: flex-end; height: 30px; padding: 0 2px; }
  .viz i {
    flex: 1; min-width: 3px; height: 100%; border-radius: 2px; transform-origin: bottom;
    background: linear-gradient(180deg, var(--dp-accent2), var(--dp-accent));
    opacity: .85;
    animation: eq .9s ease-in-out infinite alternate;
  }
  .viz.paused i { animation-play-state: paused; transform: scaleY(.12); }
  @keyframes eq { from { transform: scaleY(.12); } to { transform: scaleY(1); } }
  /* ── 滚动歌词 ── */
  .lyrics {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 20%, #000 80%, transparent);
            mask-image: linear-gradient(transparent, #000 20%, #000 80%, transparent);
  }
  .lyr-inner { position: absolute; left: 0; right: 0; top: 0; transition: transform .4s cubic-bezier(.2,.7,.3,1); }
  .lyr-line {
    padding: 4px 6px; font-size: 13px; text-align: center;
    color: var(--dp-sub); opacity: .55;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .3s, opacity .3s, font-size .3s, transform .3s;
  }
  .lyr-line.on { color: var(--dp-accent); font-size: 15px; font-weight: 700; opacity: 1; transform: scale(1.02); }
  .lyr-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dp-sub); font-size: 13px; }
  /* ── 进度与控制 ── */
  .bar { height: 4px; border-radius: 4px; background: var(--dp-line); overflow: hidden; flex: 0 0 auto; }
  .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--dp-accent), var(--dp-accent2)); border-radius: inherit; transition: width .2s linear; }
  .ctl { display: flex; align-items: center; justify-content: center; gap: 12px; flex: 0 0 auto; }
  .ctl button {
    -webkit-app-region: no-drag;
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--dp-line);
    background: var(--dp-chip); color: var(--dp-text);
    cursor: pointer; font-size: 13px; line-height: 30px; text-align: center;
    transition: border-color .15s, color .15s;
  }
  .ctl button:hover { border-color: var(--dp-accent); color: var(--dp-accent); }
  .ctl button.play { width: 40px; height: 40px; font-size: 15px; line-height: 38px; border-color: var(--dp-accent-border); }
  .ctl button.on { border-color: var(--dp-accent); color: var(--dp-accent); }
  .close, .theme {
    -webkit-app-region: no-drag;
    position: absolute; top: 8px;
    width: 24px; height: 24px; border: none; border-radius: 6px;
    background: transparent; color: var(--dp-sub); cursor: pointer; font-size: 14px;
  }
  .close { right: 10px; }
  .close:hover { color: var(--dp-text); background: var(--dp-chip); }
  .theme { right: 38px; font-size: 15px; }
  .theme:hover { color: var(--dp-accent); background: var(--dp-chip); }
</style>
</head>
<body>
  <div class="panel" id="panel" data-theme="midnight">
    <button class="theme" id="themeBtn" title="切换主题">🎨</button>
    <button class="close" id="close" title="关闭音乐桌面">✕</button>
    <div class="head">
      <img class="cover" id="cover" src="build/icon.svg" alt="">
      <div class="meta">
        <div class="title" id="title">xymusic · 音乐桌面</div>
        <div class="artist" id="artist">等待播放歌曲</div>
        <div class="viz paused" id="viz"></div>
      </div>
    </div>
    <div class="lyrics" id="lyricsBox">
      <div class="lyr-empty" id="lyrEmpty">♪ 暂无歌词</div>
      <div class="lyr-inner" id="lyrInner"></div>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div class="ctl">
      <button id="prev" title="上一首">⏮</button>
      <button id="play" class="play" title="播放/暂停">▶</button>
      <button id="next" title="下一首">⏭</button>
      <button id="lyric" title="显示/隐藏桌面歌词">词</button>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const $ = (id) => document.getElementById(id);
    const THEMES = ['midnight', 'nebula', 'sunset', 'sakura', 'pine', 'mist'];
    let theme = 'midnight', lrcKey = '', lines = [], els = [], curIdx = -1;

    // 波动条：随机时长/延迟，视觉更像真实律动
    (function buildViz() {
      const viz = $('viz'), frag = document.createDocumentFragment();
      for (let i = 0; i < 26; i++) {
        const b = document.createElement('i');
        b.style.animationDuration = (0.55 + Math.random() * 0.9).toFixed(2) + 's';
        b.style.animationDelay = (-Math.random() * 1.4).toFixed(2) + 's';
        frag.appendChild(b);
      }
      viz.appendChild(frag);
    })();

    function parseLrc(text) {
      const out = [];
      (text || '').split(/\r?\n/).forEach((line) => {
        const tags = line.match(/\[\d{1,2}:\d{1,2}(?:[.:]\d{1,3})?\]/g);
        if (!tags) return;
        const txt = line.replace(/\[[^\]]*\]/g, '').trim();
        if (!txt) return;
        tags.forEach((tag) => {
          const t = tag.match(/\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/);
          const frac = t[3] ? parseInt(t[3], 10) / Math.pow(10, t[3].length) : 0;
          out.push({ t: (+t[1]) * 60 + (+t[2]) + frac, text: txt });
        });
      });
      return out.sort((a, b) => a.t - b.t);
    }

    function buildLyrics(text) {
      lines = parseLrc(text); curIdx = -1;
      const inner = $('lyrInner');
      inner.innerHTML = ''; els = [];
      $('lyrEmpty').style.display = lines.length ? 'none' : 'grid';
      lines.forEach((ln, i) => {
        const d = document.createElement('div');
        d.className = 'lyr-line'; d.textContent = ln.text;
        inner.appendChild(d); els.push(d);
      });
      inner.style.transform = 'translateY(' + $('lyricsBox').clientHeight / 2 + 'px)';
    }

    function syncLyric(pos) {
      if (!lines.length) return;
      let idx = -1;
      for (let i = 0; i < lines.length; i++) { if (lines[i].t <= pos + 0.2) idx = i; else break; }
      if (idx === curIdx) return;
      curIdx = idx;
      if (els[curIdx]) els.forEach((el, i) => el.classList.toggle('on', i === curIdx));
      const box = $('lyricsBox'), el = els[curIdx];
      if (el) {
        const y = el.offsetTop + el.offsetHeight / 2;
        $('lyrInner').style.transform = 'translateY(' + (box.clientHeight / 2 - y) + 'px)';
      }
    }

    function applyTheme(t) {
      if (!THEMES.includes(t)) t = 'midnight';
      theme = t; $('panel').dataset.theme = t;
      try { localStorage.setItem('uzz.desktopTheme', t); } catch (e) {}
    }
    try { const saved = localStorage.getItem('uzz.desktopTheme'); if (saved) applyTheme(saved); } catch (e) {}

    $('themeBtn').addEventListener('click', () => {
      applyTheme(THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]);
    });
    ipcRenderer.on('desktopMusic:payload', (e, p) => {
      p = p || {};
      $('title').textContent = p.name || '未播放';
      $('artist').textContent = p.artist || '等待播放歌曲';
      if (p.pic) $('cover').src = p.pic;
      $('play').textContent = p.playing ? '⏸' : '▶';
      $('viz').classList.toggle('paused', !p.playing);
      const d = Number(p.duration) || 0;
      $('progress').style.width = (d ? Math.min(100, Math.max(0, (Number(p.position) || 0) / d * 100)) : 0) + '%';
      if (p.theme && p.theme !== theme) applyTheme(p.theme);
      const key = (p.key || '') + '#' + (p.lrc || '').length;
      if (key !== lrcKey) { lrcKey = key; buildLyrics(p.lrc || ''); }
      syncLyric(Number(p.position) || 0);
    });
    $('prev').addEventListener('click', () => ipcRenderer.send('desktopMusic:ctrl', 'prev'));
    $('next').addEventListener('click', () => ipcRenderer.send('desktopMusic:ctrl', 'next'));
    $('play').addEventListener('click', () => ipcRenderer.send('desktopMusic:ctrl', 'toggle'));
    $('lyric').addEventListener('click', () => ipcRenderer.send('desktopMusic:ctrl', 'lyric'));
    $('close').addEventListener('click', () => ipcRenderer.send('desktopMusic:close'));
  </script>
</body>
</html>
