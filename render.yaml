services:
  - type: web
    name: xiaoyang-music-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node index.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: XY_PUBLIC_API
        value: '1'
      # 海外部署到国内音源的 RTT 大：放宽搜索/探测超时，防误判全超时
      # （真机 4G 实测：默认 3.5s 导致网易搜索超时 → 单曲掉到酷狗、歌手/专辑/歌单全空）
      - key: XY_SEARCH_TIMEOUT
        value: '8000'
      - key: XY_PROBE_TIMEOUT
        value: '6000'
      - key: XY_RESOLVE_TIMEOUT
        value: '25000'
      # 版本检查代理用（/api/version/android、/api/release-file）：
      # 国内运营商掐断 supabase.co 后，由 Render 代替手机查版本并代理 APK 下载。
      # anon key 本就是公开只读凭据（RLS 限定 anon 只能读），入仓库安全。
      - key: SUPABASE_URL
        value: 'https://codianpoqhqilkwviota.supabase.co'
      - key: SUPABASE_ANON_KEY
        value: 'sb_publishable__DRTgpxPfdR67tsFEJ_EDQ_gvZ8VvdM'
      # 设备授权（v3.5.0 防泄露机制）：
      #   SUPABASE_SERVICE_KEY —— 读写 app_licenses 授权表（仅服务端使用，务必在
      #     Render 后台填入，绝不要提交进仓库）。未配置时授权表降级落到
      #     server/data/licenses.json（本地文件，Render 重启会丢）。
      #   XY_ADMIN_TOKEN —— 授权码签发/吊销的管理口令（同样在 Render 后台填）。
      #     留空则管理接口关闭，只有 status/verify 两条客户端接口可用。
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: XY_ADMIN_TOKEN
        sync: false
