name: Build Windows release and sync Supabase

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare build version from tag (version drift is a warning)
        run: node scripts/update-supabase.js --prepare

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Tag 发布不运行 npm test、test:studio、test:electron 等 UI 测试。
      # UI 测试保留在 windows-checks.yml，并允许失败后继续打包。
      - name: Test release configuration and sync script (non-blocking)
        continue-on-error: true
        timeout-minutes: 3
        run: npm run test:release

      - name: Build and upload GitHub Release
        working-directory: electron
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_DRAFT: 'false'

      - name: Save installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyang-windows-${{ github.ref_name }}
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest.yml
          if-no-files-found: error

      # electron-builder 24 可能复用同 Tag 已有的草稿；上传完成后自动正式发布。
      - name: Ensure GitHub Release is published
        shell: pwsh
        run: gh release edit "$env:RELEASE_TAG" --repo "$env:RELEASE_REPOSITORY" --draft=false --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Sync published version to Supabase
        run: node scripts/update-supabase.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
